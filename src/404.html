<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found - Simple IRC Client</title>
    <meta name="description" content="The page you're looking for doesn't exist." />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- @nav -->

    <main id="main" class="page pt-16">
      <h1 class="text-3xl md:text-4xl">404: page not found</h1>
      <figure class="buffer mt-8">
        <figcaption class="buffer-title"><span>status</span><span>simpleircclient.com</span></figcaption>
<pre class="buffer-body"><span class="ts">&gt;</span> /join #this-page
<span class="ts">&lt;</span> :simpleircclient.com 403 you #this-page :No such channel</pre>
      </figure>
      <p class="lede mt-8">This page doesn&apos;t exist, or it moved.</p>
      <p class="mt-6"><a href="https://simpleircclient.com/" class="btn">Back to the homepage</a></p>
    </main>

    <!-- @footer -->
  </body>
</html>
